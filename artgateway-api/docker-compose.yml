services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./config/env.docker.php:/var/www/html/config/env.php
      - /var/www/html/vendor
    depends_on:
      - db
    environment:
      APP_ENV: docker
      APP_ROOT_DIR: ${APP_ROOT_DIR:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: artgateway_db
      DB_USERNAME: ${DB_USERNAME:-artgateway_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

  db:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: artgateway_db
      MYSQL_USER: ${DB_USERNAME:-artgateway_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-db/00-phpmyadmin.sql:/docker-entrypoint-initdb.d/00-phpmyadmin.sql:ro
      - ./data/sql/artgateway_db.sql:/docker-entrypoint-initdb.d/01-artgateway-schema.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      - db

volumes:
  db_data:
