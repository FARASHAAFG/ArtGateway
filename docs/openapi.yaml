openapi: 3.0.3
info:
  title: ArtGateway API
  version: 2.0.0
  description: |
    REST API for art data: artists, artworks and museums, plus "composite" endpoints that
    enrich our own data with information from the Art Institute of Chicago public API.

    ## Media types
    **Responses** can be returned as `application/json` (default), `application/xml` or
    `application/yaml`. Choose with the `Accept` header. If none of the
    three is acceptable the API answers `406`. Errors are returned in the same format as
    successful responses (when the format cannot be determined, as with a 406, JSON is used).

    **Request bodies** on registration, login and resource create/update endpoints accept
    `application/json`, `application/xml`, or `application/yaml`. The request root must be
    an object/mapping. XML DTDs are rejected; YAML object construction is disabled.

    In XML responses, the root element is `<response>`, list items are wrapped in `<item>` and
    `null` becomes an empty tag. XML requests may use any root element name; its child elements
    form the mapping. Examples in this document are shown in JSON.

    `/phpinfo` is an HTML diagnostic page and is not part of the JSON/XML/YAML API contract.

    ## Errors
    Every error uses the same body: `status`, `error`, `message`, optional `details`
    (field name -> problem) and `requestId`. The same id is sent in the `X-Request-Id`
    response header and written to the server log, so a problem can be traced.
    500 errors never expose internal details. Using a method a route does not support gives
    `405` (with an `Allow` header) and an unknown URL gives `404`.

    ## Authentication
    Register with `POST /register` and sign in with `POST /login` (or `POST /token`) to
    receive a one-hour bearer token. Registration always creates a regular user; admin
    accounts must be provisioned by an administrator. Public read endpoints remain open.
    All artwork, artist and museum create/update/delete endpoints require an admin token. Send it
    as `Authorization: Bearer <access_token>`. Configure `JWT_SECRET` to a random secret
    of at least 32 characters before using authentication. Passwords are limited to 72
    bytes because the current PHP `PASSWORD_DEFAULT` algorithm uses bcrypt.

    ## Remaining planned work
    Writing `tags` on artworks and collection/user resource endpoints still need concrete
    request, response and authorization contracts. The PHP/JavaScript
    consumers of the composite endpoints are also not described here.
  contact:
    name: ArtGateway team
servers:
  - url: http://localhost/ArtGateway/artgateway-api
    description: Local development (Wampoon / XAMPP)
tags:
  - name: Artworks
  - name: Artists
  - name: Museums
  - name: Composite
    description: Our data combined with the Art Institute of Chicago API
  - name: General
  - name: Authentication

paths:
  /:
    get:
      tags: [General]
      summary: API information
      operationId: getApiInfo
      responses:
        '200':
          description: Basic information about the API.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiInfo'}
              example:
                api: artgateway-api
                version: 2.0.0
                about: REST API for artists, artworks and museums, with data enriched from the Art Institute of Chicago.
                resources: [/artworks, /artists, /museums, '/artworks/{id}/external', '/artists/{id}/external']
                formats: [application/json, application/xml, application/yaml]
            application/xml:
              schema: {$ref: '#/components/schemas/ApiInfo'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ApiInfo'}
        '406': {$ref: '#/components/responses/NotAcceptable'}

  /register:
    post:
      tags: [Authentication]
      summary: Register a user account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrationInput'}
            example: {full_name: Alex Rivera, email: alex@example.com, password: correct-horse-42}
          application/xml:
            schema: {$ref: '#/components/schemas/RegistrationInput'}
            example: <response><full_name>Alex Rivera</full_name><email>alex@example.com</email><password>correct-horse-42</password></response>
          application/yaml:
            schema: {$ref: '#/components/schemas/RegistrationInput'}
            example: {full_name: Alex Rivera, email: alex@example.com, password: correct-horse-42}
      responses:
        '201':
          description: The new account and its bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
            application/xml:
              schema: {$ref: '#/components/schemas/TokenResponse'}
            application/yaml:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /login:
    post:
      tags: [Authentication]
      summary: Sign in as a user or administrator
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
          application/xml:
            schema: {$ref: '#/components/schemas/Credentials'}
          application/yaml:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200':
          description: The account and its bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
            application/xml:
              schema: {$ref: '#/components/schemas/TokenResponse'}
            application/yaml:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /token:
    post:
      tags: [Authentication]
      summary: Sign in and generate a bearer token (alias for /login)
      operationId: generateToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
          application/xml:
            schema: {$ref: '#/components/schemas/Credentials'}
          application/yaml:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200':
          description: The account and its bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
            application/xml:
              schema: {$ref: '#/components/schemas/TokenResponse'}
            application/yaml:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me:
    get:
      tags: [Authentication]
      summary: Get the authenticated account
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/AuthUser'}
            application/xml:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/AuthUser'}
            application/yaml:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/AuthUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /artworks:
    get:
      tags: [Artworks]
      summary: List artworks (paginated, filterable, sortable)
      operationId: listArtworks
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - name: sort
          in: query
          description: Field to sort by.
          schema: {type: string, enum: [id, title, year, period], default: id}
        - {$ref: '#/components/parameters/Order'}
        - name: period
          in: query
          description: Filter by period.
          schema: {type: string}
          example: Impressionism
        - name: title
          in: query
          description: Filter by title (case-insensitive, partial match, max 255 characters).
          schema: {type: string, maxLength: 255}
          example: poppies
        - name: year_min
          in: query
          description: Only artworks created in or after this year. Must be between -3000 and the current year, and cannot exceed `year_max`.
          schema: {type: integer, minimum: -3000}
          example: 1800
        - name: year_max
          in: query
          description: Only artworks created in or before this year. Must be between -3000 and the current year.
          schema: {type: integer, minimum: -3000}
          example: 1900
      responses:
        '200':
          description: A page of artworks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtworkPage'}
              example:
                data:
                  - id: 1
                    title: Poppies
                    creationYear: 1873
                    medium: Oil on canvas
                    period: Impressionism
                    dimensions: null
                    artistId: 1
                    museumId: 1
                    tags: [landscape, flowers]
                pagination: {current_page: 1, per_page: 2, total_items: 3, total_pages: 2}
                links:
                  first: http://localhost/ArtGateway/artgateway-api/artworks?sort=id&order=asc&limit=2&page=1
                  prev: null
                  next: http://localhost/ArtGateway/artgateway-api/artworks?sort=id&order=asc&limit=2&page=2
                  last: http://localhost/ArtGateway/artgateway-api/artworks?sort=id&order=asc&limit=2&page=2
            application/xml:
              schema: {$ref: '#/components/schemas/ArtworkPage'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ArtworkPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Artworks]
      summary: Create an artwork
      operationId: createArtwork
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtworkInput'}
            example:
              title: Apples
              creationYear: 1895
              medium: Oil on canvas
              period: Post-Impressionism
              dimensions: 68 x 92 cm
              artistId: 3
              museumId: 1
          application/xml:
            schema: {$ref: '#/components/schemas/ArtworkInput'}
            example: <response><title>Apples</title><creationYear>1895</creationYear><medium>Oil on canvas</medium><period>Post-Impressionism</period><dimensions>68 x 92 cm</dimensions><artistId>3</artistId><museumId>1</museumId></response>
          application/yaml:
            schema: {$ref: '#/components/schemas/ArtworkInput'}
            example: {title: Apples, creationYear: 1895, medium: Oil on canvas, period: Post-Impressionism, dimensions: '68 x 92 cm', artistId: 3, museumId: 1}
      responses:
        '201':
          description: Created. The `Location` header points to the new artwork.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artwork'}
              example:
                id: 4
                title: Apples
                creationYear: 1895
                medium: Oil on canvas
                period: Post-Impressionism
                dimensions: 68 x 92 cm
                artistId: 3
                museumId: 1
                tags: []
            application/xml:
              schema: {$ref: '#/components/schemas/Artwork'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Artwork'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}

  /artworks/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Artworks]
      summary: Get one artwork
      operationId: getArtwork
      responses:
        '200':
          description: The artwork.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artwork'}
              example:
                id: 1
                title: Poppies
                creationYear: 1873
                medium: Oil on canvas
                period: Impressionism
                dimensions: null
                artistId: 1
                museumId: 1
                tags: [landscape, flowers]
            application/xml:
              schema: {$ref: '#/components/schemas/Artwork'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Artwork'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Artworks]
      summary: Replace an artwork
      description: |
        Full replacement: every field is overwritten, so optional fields left out of the body
        become `null`. `tags` cannot be changed yet.
      operationId: updateArtwork
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtworkInput'}
            example:
              title: Apples and Oranges
              creationYear: 1899
              artistId: 3
              museumId: 1
          application/xml:
            schema: {$ref: '#/components/schemas/ArtworkInput'}
            example: <response><title>Apples and Oranges</title><creationYear>1899</creationYear><artistId>3</artistId><museumId>1</museumId></response>
          application/yaml:
            schema: {$ref: '#/components/schemas/ArtworkInput'}
            example: {title: Apples and Oranges, creationYear: 1899, artistId: 3, museumId: 1}
      responses:
        '200':
          description: The updated artwork.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artwork'}
            application/xml:
              schema: {$ref: '#/components/schemas/Artwork'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Artwork'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Artworks]
      summary: Delete an artwork
      operationId: deleteArtwork
      security:
        - BearerAuth: []
      responses:
        '204': {description: Deleted. No body.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}

  /artworks/{id}/external:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Composite]
      summary: An artwork plus matching data from the Art Institute of Chicago
      description: |
        Returns our artwork and, when found, the best match from the Art Institute of Chicago
        (title and artist matching; at most 5 candidates examined). The museum is optional:
        if it is down, slow or has no match, this endpoint still answers `200` with
        `external: null` and an `externalStatus` explaining why. `imageUrl` is only
        provided for public-domain works.

        | externalStatus | meaning |
        |---|---|
        | `ok` | a match was found; `external` is filled |
        | `not_found` | the museum answered but has no match |
        | `unavailable` | the museum could not be reached (timeout, error, rate limit) |
      operationId: getArtworkWithExternal
      responses:
        '200':
          description: The artwork with its external data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtworkComposite'}
              examples:
                ok:
                  summary: Match found
                  value:
                    artwork:
                      id: 1
                      title: Poppies
                      creationYear: 1873
                      medium: Oil on canvas
                      period: Impressionism
                      dimensions: null
                      artistId: 1
                      museumId: 1
                      tags: [landscape, flowers]
                    external:
                      source: Art Institute of Chicago
                      sourceUrl: https://www.artic.edu/artworks/16568
                      attribution: Data courtesy of the Art Institute of Chicago (CC0 1.0)
                      title: Poppies
                      artist: Claude Monet
                      dateDisplay: 1873 (approx)
                      medium: Oil on canvas
                      placeOfOrigin: France
                      department: Painting and Sculpture of Europe
                      description: A field of poppies.
                      isPublicDomain: true
                      imageUrl: https://www.artic.edu/iiif/2/e2da9a9e-0000-4000-8000-123456789abc/full/843,/0/default.jpg
                    externalStatus: ok
                notFound:
                  summary: No match at the museum
                  value:
                    artwork: {id: 3, title: The Bedroom, creationYear: 1888, medium: Oil on canvas, period: Post-Impressionism, dimensions: null, artistId: 2, museumId: 2, tags: []}
                    external: null
                    externalStatus: not_found
                unavailable:
                  summary: Museum unreachable
                  value:
                    artwork: {id: 1, title: Poppies, creationYear: 1873, medium: Oil on canvas, period: Impressionism, dimensions: null, artistId: 1, museumId: 1, tags: [landscape, flowers]}
                    external: null
                    externalStatus: unavailable
            application/xml:
              schema: {$ref: '#/components/schemas/ArtworkComposite'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ArtworkComposite'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}

  /artists:
    get:
      tags: [Artists]
      summary: List artists (paginated, filterable, sortable)
      operationId: listArtists
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - name: sort
          in: query
          schema: {type: string, enum: [id, name, birthYear, deathYear, nationality], default: id}
        - {$ref: '#/components/parameters/Order'}
        - name: name
          in: query
          description: Filter by name (partial match, max 150 characters).
          schema: {type: string, maxLength: 150}
          example: monet
        - name: nationality
          in: query
          description: Filter by nationality (max 100 characters).
          schema: {type: string, maxLength: 100}
          example: French
        - name: birthYear_min
          in: query
          description: Must be between -3000 and the current year.
          schema: {type: integer, minimum: -3000}
          example: 1800
        - name: birthYear_max
          in: query
          description: Must be between -3000 and the current year, and cannot be lower than `birthYear_min`.
          schema: {type: integer, minimum: -3000}
          example: 1900
      responses:
        '200':
          description: A page of artists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistPage'}
              example:
                data:
                  - {id: 1, name: Claude Monet, birthYear: 1840, deathYear: 1926, nationality: French}
                pagination: {current_page: 1, per_page: 1, total_items: 2, total_pages: 2}
                links:
                  first: http://localhost/ArtGateway/artgateway-api/artists?sort=id&order=asc&limit=1&page=1
                  prev: null
                  next: http://localhost/ArtGateway/artgateway-api/artists?sort=id&order=asc&limit=1&page=2
                  last: http://localhost/ArtGateway/artgateway-api/artists?sort=id&order=asc&limit=1&page=2
            application/xml:
              schema: {$ref: '#/components/schemas/ArtistPage'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ArtistPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Artists]
      summary: Create an artist
      operationId: createArtist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtistInput'}
            example: {name: Paul Cezanne, birthYear: 1839, deathYear: 1906, nationality: French}
          application/xml:
            schema: {$ref: '#/components/schemas/ArtistInput'}
            example: <response><name>Paul Cezanne</name><birthYear>1839</birthYear><deathYear>1906</deathYear><nationality>French</nationality></response>
          application/yaml:
            schema: {$ref: '#/components/schemas/ArtistInput'}
            example: {name: Paul Cezanne, birthYear: 1839, deathYear: 1906, nationality: French}
      responses:
        '201':
          description: Created. The `Location` header points to the new artist.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
              example: {id: 3, name: Paul Cezanne, birthYear: 1839, deathYear: 1906, nationality: French}
            application/xml:
              schema: {$ref: '#/components/schemas/Artist'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Artist'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}

  /artists/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Artists]
      summary: Get one artist
      operationId: getArtist
      responses:
        '200':
          description: The artist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
              example: {id: 1, name: Claude Monet, birthYear: 1840, deathYear: 1926, nationality: French}
            application/xml:
              schema: {$ref: '#/components/schemas/Artist'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Artist'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Artists]
      summary: Replace an artist
      description: Full replacement; optional fields left out become `null`.
      operationId: updateArtist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtistInput'}
            example: {name: Paul Cézanne, birthYear: 1839, deathYear: 1906, nationality: French}
          application/xml:
            schema: {$ref: '#/components/schemas/ArtistInput'}
            example: <response><name>Paul Cézanne</name><birthYear>1839</birthYear><deathYear>1906</deathYear><nationality>French</nationality></response>
          application/yaml:
            schema: {$ref: '#/components/schemas/ArtistInput'}
            example: {name: Paul Cézanne, birthYear: 1839, deathYear: 1906, nationality: French}
      responses:
        '200':
          description: The updated artist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
            application/xml:
              schema: {$ref: '#/components/schemas/Artist'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Artist'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Artists]
      summary: Delete an artist
      description: An artist that still has artworks cannot be deleted (`409`).
      operationId: deleteArtist
      security:
        - BearerAuth: []
      responses:
        '204': {description: Deleted. No body.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}

  /artists/{id}/artworks:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Artists]
      summary: Artworks by one artist
      description: Paginated list. Returns 404 if the artist does not exist.
      operationId: listArtistArtworks
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of the artist's artworks (without `tags`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtworkSummaryPage'}
              example:
                data:
                  - {id: 1, title: Poppies, creationYear: 1873, medium: Oil on canvas, period: Impressionism, dimensions: null, artistId: 1, museumId: 1}
                pagination: {current_page: 1, per_page: 20, total_items: 1, total_pages: 1}
                links: {first: 'http://localhost/ArtGateway/artgateway-api/artists/1/artworks?limit=20&page=1', prev: null, next: null, last: 'http://localhost/ArtGateway/artgateway-api/artists/1/artworks?limit=20&page=1'}
            application/xml:
              schema: {$ref: '#/components/schemas/ArtworkSummaryPage'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ArtworkSummaryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}

  /artists/{id}/external:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Composite]
      summary: An artist, their artworks and matching data from the Art Institute of Chicago
      description: |
        Same failure policy as `/artworks/{id}/external`: museum problems never break this
        endpoint, they only turn `external` into `null` and set `externalStatus`
        (`ok`, `not_found` or `unavailable`).
      operationId: getArtistWithExternal
      responses:
        '200':
          description: The artist with their artworks and external data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistComposite'}
              example:
                artist: {id: 1, name: Claude Monet, birthYear: 1840, deathYear: 1926, nationality: French}
                artworks:
                  - {id: 1, title: Poppies, creationYear: 1873, medium: Oil on canvas, period: Impressionism, dimensions: null, artistId: 1, museumId: 1}
                external:
                  source: Art Institute of Chicago
                  sourceUrl: https://www.artic.edu/artists/35809
                  attribution: Data courtesy of the Art Institute of Chicago (CC0 1.0)
                  name: Claude Monet
                  birthYear: 1840
                  deathYear: 1926
                  description: French Impressionist painter.
                externalStatus: ok
            application/xml:
              schema: {$ref: '#/components/schemas/ArtistComposite'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ArtistComposite'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}

  /museums:
    get:
      tags: [Museums]
      summary: List museums (paginated)
      operationId: listMuseums
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of museums.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MuseumPage'}
              example:
                data:
                  - {id: 1, name: Musée d'Orsay, city: Paris, country: France, website: 'https://www.musee-orsay.fr'}
                pagination: {current_page: 1, per_page: 20, total_items: 1, total_pages: 1}
                links: {first: 'http://localhost/ArtGateway/artgateway-api/museums?limit=20&page=1', prev: null, next: null, last: 'http://localhost/ArtGateway/artgateway-api/museums?limit=20&page=1'}
            application/xml:
              schema: {$ref: '#/components/schemas/MuseumPage'}
            application/yaml:
              schema: {$ref: '#/components/schemas/MuseumPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Museums]
      summary: Create a museum
      operationId: createMuseum
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MuseumInput'}
            example: {name: Example Museum, city: Paris, country: France, website: 'https://example.org'}
          application/xml:
            schema: {$ref: '#/components/schemas/MuseumInput'}
            example: <response><name>Example Museum</name><city>Paris</city><country>France</country><website>https://example.org</website></response>
          application/yaml:
            schema: {$ref: '#/components/schemas/MuseumInput'}
            example: {name: Example Museum, city: Paris, country: France, website: 'https://example.org'}
      responses:
        '201':
          description: The created museum.
          headers:
            Location:
              description: URL of the created museum.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Museum'}
            application/xml:
              schema: {$ref: '#/components/schemas/Museum'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Museum'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}

  /museums/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Museums]
      summary: Get one museum
      operationId: getMuseum
      responses:
        '200':
          description: The museum.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Museum'}
              example: {id: 1, name: Musée d'Orsay, city: Paris, country: France, website: 'https://www.musee-orsay.fr'}
            application/xml:
              schema: {$ref: '#/components/schemas/Museum'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Museum'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [Museums]
      summary: Replace a museum
      description: Full replacement; `website` may be omitted or null.
      operationId: updateMuseum
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MuseumInput'}
          application/xml:
            schema: {$ref: '#/components/schemas/MuseumInput'}
          application/yaml:
            schema: {$ref: '#/components/schemas/MuseumInput'}
      responses:
        '200':
          description: The updated museum.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Museum'}
            application/xml:
              schema: {$ref: '#/components/schemas/Museum'}
            application/yaml:
              schema: {$ref: '#/components/schemas/Museum'}
        '400': {$ref: '#/components/responses/MalformedJson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Museums]
      summary: Delete a museum
      description: Deleting a museum sets its artworks' `museumId` to null.
      operationId: deleteMuseum
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Museum deleted.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}

  /museums/{id}/artworks:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Museums]
      summary: Artworks held by one museum
      description: Paginated list. Returns 404 if the museum does not exist.
      operationId: listMuseumArtworks
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of the museum's artworks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtworkSummaryPage'}
              example:
                data:
                  - {id: 1, title: Poppies, creationYear: 1873, medium: Oil on canvas, period: Impressionism}
                pagination: {current_page: 1, per_page: 20, total_items: 1, total_pages: 1}
                links: {first: 'http://localhost/ArtGateway/artgateway-api/museums/1/artworks?limit=20&page=1', prev: null, next: null, last: 'http://localhost/ArtGateway/artgateway-api/museums/1/artworks?limit=20&page=1'}
            application/xml:
              schema: {$ref: '#/components/schemas/ArtworkSummaryPage'}
            application/yaml:
              schema: {$ref: '#/components/schemas/ArtworkSummaryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '500': {$ref: '#/components/responses/ServerError'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Numeric id of the resource (positive unsigned 32-bit integer).
      schema: {type: integer, minimum: 1, maximum: 4294967295}
      example: 1
    Page:
      name: page
      in: query
      description: Page number (1-1000).
      schema: {type: integer, minimum: 1, maximum: 1000, default: 1}
    Limit:
      name: limit
      in: query
      description: Items per page (1-100).
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Order:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: asc}

  headers:
    Location:
      description: URL of the newly created resource.
      schema: {type: string}
      example: /ArtGateway/artgateway-api/artists/3

  schemas:
    RegistrationInput:
      type: object
      required: [full_name, email, password]
      properties:
        full_name: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, description: "Registration requires 8–72 bytes. The current bcrypt hash ignores bytes beyond this limit."}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, description: "At most 72 bytes. The current bcrypt hash ignores bytes beyond this limit."}
    AuthUser:
      type: object
      properties:
        id: {type: integer}
        full_name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [user, admin]}
    TokenResponse:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, example: 3600}
        user: {$ref: '#/components/schemas/AuthUser'}
    ApiInfo:
      type: object
      properties:
        api: {type: string}
        version: {type: string}
        about: {type: string}
        resources: {type: array, items: {type: string}}
        formats: {type: array, items: {type: string}}
    Artwork:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        creationYear: {type: integer}
        medium: {type: string, nullable: true}
        period: {type: string, nullable: true}
        dimensions: {type: string, nullable: true}
        artistId: {type: integer}
        museumId: {type: integer, nullable: true}
        tags:
          type: array
          description: Read-only for now.
          items: {type: string}
    ArtworkSummary:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        creationYear: {type: integer}
        medium: {type: string, nullable: true}
        period: {type: string, nullable: true}
        dimensions: {type: string, nullable: true}
        artistId: {type: integer}
        museumId: {type: integer, nullable: true}
    ArtworkInput:
      type: object
      required: [title, creationYear, artistId]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        creationYear: {type: integer, minimum: -3000, description: Must not be in the future.}
        medium: {type: string, maxLength: 150, nullable: true}
        period: {type: string, maxLength: 100, nullable: true}
        dimensions: {type: string, maxLength: 100, nullable: true}
        artistId: {type: integer, minimum: 1, maximum: 4294967295, description: Must be an existing artist.}
        museumId: {type: integer, minimum: 1, maximum: 4294967295, nullable: true, description: Must be an existing museum when given.}
    Artist:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        birthYear: {type: integer, nullable: true}
        deathYear: {type: integer, nullable: true}
        nationality: {type: string, nullable: true}
    ArtistInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 150}
        birthYear: {type: integer, minimum: -3000, nullable: true, description: Must not be in the future.}
        deathYear: {type: integer, minimum: -3000, nullable: true, description: Must not be in the future or before birthYear when birthYear is provided.}
        nationality: {type: string, maxLength: 100, nullable: true}
    Museum:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        city: {type: string}
        country: {type: string}
        website: {type: string, nullable: true}
    MuseumInput:
      type: object
      required: [name, city, country]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        city: {type: string, minLength: 1, maxLength: 100}
        country: {type: string, minLength: 1, maxLength: 100}
        website: {type: string, maxLength: 2048, nullable: true}
    Pagination:
      type: object
      properties:
        current_page: {type: integer}
        per_page: {type: integer}
        total_items: {type: integer}
        total_pages: {type: integer}
    PageLinks:
      type: object
      properties:
        first: {type: string, nullable: true}
        prev: {type: string, nullable: true}
        next: {type: string, nullable: true}
        last: {type: string, nullable: true}
    ArtworkPage:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Artwork'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        links: {$ref: '#/components/schemas/PageLinks'}
    ArtistPage:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Artist'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        links: {$ref: '#/components/schemas/PageLinks'}
    MuseumPage:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Museum'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        links: {$ref: '#/components/schemas/PageLinks'}
    ArtworkSummaryPage:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ArtworkSummary'}
        pagination: {$ref: '#/components/schemas/Pagination'}
        links: {$ref: '#/components/schemas/PageLinks'}
    ExternalStatus:
      type: string
      enum: [ok, not_found, unavailable]
      description: |
        `not_found` means the upstream returned a valid search response with no matching
        record. Non-200 upstream responses (including 404 and 429), timeouts, invalid JSON,
        and unexpected response structures are reported as `unavailable`. Upstream quota
        responses are not retried.
    ExternalArtwork:
      type: object
      nullable: true
      properties:
        source: {type: string}
        sourceUrl: {type: string}
        attribution: {type: string}
        title: {type: string}
        artist: {type: string, nullable: true}
        dateDisplay: {type: string, nullable: true}
        medium: {type: string, nullable: true}
        placeOfOrigin: {type: string, nullable: true}
        department: {type: string, nullable: true}
        description: {type: string, nullable: true}
        isPublicDomain: {type: boolean}
        imageUrl: {type: string, nullable: true, description: Only set for public-domain works.}
    ExternalArtist:
      type: object
      nullable: true
      properties:
        source: {type: string}
        sourceUrl: {type: string}
        attribution: {type: string}
        name: {type: string}
        birthYear: {type: integer, nullable: true}
        deathYear: {type: integer, nullable: true}
        description: {type: string, nullable: true}
    ArtworkComposite:
      type: object
      properties:
        artwork: {$ref: '#/components/schemas/Artwork'}
        external: {$ref: '#/components/schemas/ExternalArtwork'}
        externalStatus: {$ref: '#/components/schemas/ExternalStatus'}
    ArtistComposite:
      type: object
      properties:
        artist: {$ref: '#/components/schemas/Artist'}
        artworks:
          type: array
          items: {$ref: '#/components/schemas/ArtworkSummary'}
        external: {$ref: '#/components/schemas/ExternalArtist'}
        externalStatus: {$ref: '#/components/schemas/ExternalStatus'}
    Error:
      type: object
      required: [status, error, message, requestId]
      properties:
        status: {type: integer, example: 422}
        error: {type: string, example: Unprocessable Entity}
        message: {type: string, example: Validation failed}
        details:
          type: object
          description: Field name -> what is wrong. Only on validation errors.
          additionalProperties: {type: string}
        requestId: {type: string, example: 2acd6dc6dd75fe41}

  responses:
    Unauthorized:
      description: Authentication is required or the bearer token is invalid or expired.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: The authenticated user does not have administrator privileges.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Invalid path id or query parameter (for example `limit=500`, `id=abc`, or a min greater than its max).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 400
            error: Bad Request
            message: Validation failed
            details: {limit: limit cannot exceed 100.}
            requestId: ebba5bc42cebb95b
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    MalformedJson:
      description: The request body is empty, malformed, or is not a JSON object, XML mapping, or YAML mapping.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 400, error: Bad Request, message: Request body contains invalid data, requestId: e99d34ae60801193}
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: No resource with that id.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 404, error: Not Found, message: Artwork not found, requestId: bfeaec705b2997ae}
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    NotAcceptable:
      description: The `Accept` header allows none of application/json, application/xml, application/yaml. Always returned as JSON.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 406
            error: Not Acceptable
            message: 'This API can only return: application/json, application/xml, application/yaml'
            requestId: e947ab25947d13ee
    UnsupportedMediaType:
      description: The request `Content-Type` is not one of the supported JSON, XML, or YAML media types.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {status: 415, error: Unsupported Media Type, message: 'Request Content-Type must be JSON, XML, or YAML.', requestId: 2e834f8bfe5df349}
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: The body is a valid object or mapping, but some fields are not acceptable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 422
            error: Unprocessable Entity
            message: Validation failed
            details: {name: name cannot be empty, birthYear: birthYear must be a whole number}
            requestId: 2acd6dc6dd75fe41
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: The request conflicts with existing data.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            status: 409
            error: Conflict
            message: This artist still has artworks. Delete or reassign them first.
            requestId: 1d3b0f9c45ad044f
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: Unexpected server error. Details are only in the server log, found with `requestId`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
        application/xml:
          schema: {$ref: '#/components/schemas/Error'}
        application/yaml:
          schema: {$ref: '#/components/schemas/Error'}
